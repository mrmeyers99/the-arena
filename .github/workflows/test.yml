name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so diff-cover can diff against the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      # Patch coverage gate: lines added or changed in src/ (excluding tests)
      # must be at least 80% covered.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: github.event_name == 'pull_request'
        with:
          python-version: '3.12'
      - name: Install diff-cover
        if: github.event_name == 'pull_request'
        run: pip install diff-cover
      - name: Check coverage of changed lines (>= 80%)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          diff-cover coverage/lcov.info \
            --compare-branch="origin/${BASE_REF}" \
            --include 'src/**' \
            --exclude '*.test.js' '*.test.jsx' 'src/test/*' \
            --format "markdown:diff-cover.md" \
            --show-uncovered \
            --fail-under=80
      - name: Write diff coverage summary
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ -f diff-cover.md ]; then
            cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
          fi

name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so diff-cover can diff against the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      # Patch coverage gate: lines added or changed in src/ (excluding tests)
      # must be at least 80% covered.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: github.event_name == 'pull_request'
        with:
          python-version: '3.12'
      - name: Install diff-cover
        if: github.event_name == 'pull_request'
        run: pip install diff-cover
      - name: Check coverage of changed lines (>= 80%)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          diff-cover coverage/lcov.info \
            --compare-branch="origin/${BASE_REF}" \
            --include 'src/**' \
            --exclude '*.test.js' '*.test.jsx' 'src/test/*' \
            --format "markdown:diff-cover.md" \
            --show-uncovered \
            --fail-under=80
      - name: Write diff coverage summary
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ -f diff-cover.md ]; then
            cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
          fi

# Deploys firestore.rules and firestore.indexes.json to the live project.
# Called from ci.yml on every push to main, after all CI checks pass. It can
# also be run by hand (workflow_dispatch) to redeploy main's rules.
name: Deploy Firestore Rules

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Only deploy reviewed rules from main. A dispatch from any other branch
    # would push unreviewed rules live and expose the service account to that
    # branch's code (npm ci runs lifecycle scripts).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Same environment as the hosting deploy. Add required reviewers and move
    # the service account secret here in Settings > Environments to gate it.
    environment: production
    concurrency:
      group: firestore-rules-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMPETITION_HUB_B047F }}
        run: |
          creds="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$creds"
          chmod 600 "$creds"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$creds" >> "$GITHUB_ENV"
      - name: Deploy rules and indexes
        run: npx firebase-tools deploy --only firestore:rules,firestore:indexes --project competition-hub-b047f --non-interactive
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
